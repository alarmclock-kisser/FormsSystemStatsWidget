[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-inference-engine"
version = "0.1.0"
description = "Backend-agnostic Python LLM inference core built on ONNX Runtime CUDA."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "onnxruntime-gpu>=1.27,<2",
    "transformers>=5.0,<6",
    "tokenizers>=0.22,<1",
    "jinja2>=3.1,<4",
    "flask>=3.0,<4",
]

[tool.setuptools.packages.find]
include = ["onnx_engine*"]
